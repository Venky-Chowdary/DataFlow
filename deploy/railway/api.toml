# Railway — API service
# In Railway dashboard: New Service → GitHub repo → Settings:
#   Config file path: deploy/railway/api.toml
# Add MongoDB plugin to the project and link MONGO_URL → API service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["apps/api/**", "packages/preflight/**", "Dockerfile.api"]

[deploy]
# Liveness (not readiness) — Railway deploy healthchecks must hit a cheap path
# that does not block on Mongo/RAG warm-up. Runtime readiness should use
# /health/ready separately.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
