{{ if .Values.worker.enabled -}}
{{- if lt (int .Values.worker.terminationGracePeriodSeconds) (add (int .Values.worker.drainSeconds) 10) }}
{{- fail "worker.terminationGracePeriodSeconds must be at least worker.drainSeconds + 10: the worker needs the drain period plus time to exit before SIGKILL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.fullname" . }}-worker
  labels:
    app.kubernetes.io/component: worker
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      {{- include "dataflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "dataflow.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dataflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - python
            - -m
            - src.worker_main
          env:
            {{- include "dataflow.commonEnv" . | nindent 12 }}
            - name: DATAFLOW_PROCESS_ROLE
              value: worker
            - name: DATAFLOW_WORKER_FLEET
              value: "1"
            - name: DATAFLOW_API_CLAIM_LOOP
              value: "0"
            - name: DATAFLOW_SCHEDULE_LOOP
              value: "0"
            - name: DATAFLOW_ACK_BACKEND
              value: mongo
            - name: DATAFLOW_WORKER_MODE
              value: {{ .Values.worker.mode | quote }}
            - name: DATAFLOW_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: DATAFLOW_WORKER_DRAIN_SECONDS
              value: {{ .Values.worker.drainSeconds | quote }}
          {{- include "dataflow.secretEnvFrom" . | nindent 10 }}
          {{- include "dataflow.metricsPortAndProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "dataflow.runtimeVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "dataflow.runtimeVolumes" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.worker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.worker.affinity | nindent 8 }}
{{- end }}
