{{ if .Values.cdcWorker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.fullname" . }}-cdc-worker
  labels:
    app.kubernetes.io/component: cdc-worker
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cdcWorker.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cdc-worker
      {{- include "dataflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cdc-worker
        {{- include "dataflow.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dataflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cdc-worker
          image: "{{ .Values.cdcWorker.image.repository }}:{{ .Values.cdcWorker.image.tag }}"
          imagePullPolicy: {{ .Values.cdcWorker.image.pullPolicy }}
          command:
            - python
            - -m
            - src.worker_main
          env:
            {{- include "dataflow.commonEnv" . | nindent 12 }}
            - name: DATAFLOW_PROCESS_ROLE
              value: worker
            - name: DATAFLOW_WORKER_FLEET
              value: "1"
            - name: DATAFLOW_API_CLAIM_LOOP
              value: "0"
            - name: DATAFLOW_SCHEDULE_LOOP
              value: "0"
            - name: DATAFLOW_ACK_BACKEND
              value: mongo
            - name: DATAFLOW_WORKER_MODE
              value: {{ .Values.cdcWorker.mode | default "cdc" | quote }}
          {{- include "dataflow.secretEnvFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.cdcWorker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.cdcWorker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.cdcWorker.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.cdcWorker.affinity | nindent 8 }}
{{- end }}
