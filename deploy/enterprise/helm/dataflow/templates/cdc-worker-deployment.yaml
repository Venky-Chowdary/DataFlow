{{ if .Values.cdcWorker.enabled -}}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.cdcWorker.terminationGracePeriodSeconds)) }}
{{- fail "cdcWorker.terminationGracePeriodSeconds must be a whole number of seconds, such as 10 (Helm reads a duration such as 10s as 0)" }}
{{- end }}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.cdcWorker.drainSeconds)) }}
{{- fail "cdcWorker.drainSeconds must be a whole number of seconds, such as 10 (Helm reads a duration such as 10s as 0)" }}
{{- end }}
{{- if lt (int .Values.cdcWorker.terminationGracePeriodSeconds) (add (int .Values.cdcWorker.drainSeconds) 10) }}
{{- fail "cdcWorker.terminationGracePeriodSeconds must be at least cdcWorker.drainSeconds + 10: the worker needs the drain period plus time to exit before SIGKILL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.fullname" . }}-cdc-worker
  labels:
    app.kubernetes.io/component: cdc-worker
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cdcWorker.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: cdc-worker
      {{- include "dataflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cdc-worker
        {{- include "dataflow.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dataflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.cdcWorker.terminationGracePeriodSeconds }}
      containers:
        - name: cdc-worker
          image: "{{ .Values.cdcWorker.image.repository }}:{{ .Values.cdcWorker.image.tag }}"
          imagePullPolicy: {{ .Values.cdcWorker.image.pullPolicy }}
          command:
            - python
            - -m
            - src.worker_main
          env:
            {{- include "dataflow.commonEnv" . | nindent 12 }}
            - name: DATAFLOW_PROCESS_ROLE
              value: worker
            - name: DATAFLOW_WORKER_FLEET
              value: "1"
            - name: DATAFLOW_API_CLAIM_LOOP
              value: "0"
            - name: DATAFLOW_SCHEDULE_LOOP
              value: "0"
            - name: DATAFLOW_ACK_BACKEND
              value: mongo
            - name: DATAFLOW_WORKER_MODE
              value: {{ .Values.cdcWorker.mode | default "cdc" | quote }}
            - name: DATAFLOW_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: DATAFLOW_WORKER_DRAIN_SECONDS
              value: {{ .Values.cdcWorker.drainSeconds | quote }}
          {{- include "dataflow.secretEnvFrom" . | nindent 10 }}
          {{- include "dataflow.metricsPortAndProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.cdcWorker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "dataflow.runtimeVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "dataflow.runtimeVolumes" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.cdcWorker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.cdcWorker.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.cdcWorker.affinity | nindent 8 }}
{{- end }}
