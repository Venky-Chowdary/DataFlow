{{ if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteSecretName | required "externalSecrets.remoteSecretName is required" }}
{{- end }}
---
{{ if and (not .Values.externalSecrets.enabled) .Values.secrets.create -}}
{{- if not .Values.secrets.stringData.REDIS_PASSWORD }}
{{- fail "secrets.stringData.REDIS_PASSWORD is required when secrets.create is true" }}
{{- end }}
{{- if not .Values.secrets.stringData.POSTGRES_PASSWORD }}
{{- fail "secrets.stringData.POSTGRES_PASSWORD is required when secrets.create is true" }}
{{- end }}
{{- if not .Values.secrets.stringData.MONGODB_PASSWORD }}
{{- fail "secrets.stringData.MONGODB_PASSWORD is required when secrets.create is true" }}
{{- end }}
{{- if not .Values.secrets.stringData.DATAFLOW_AUTH_SECRET }}
{{- fail "secrets.stringData.DATAFLOW_AUTH_SECRET is required when secrets.create is true" }}
{{- end }}
{{- if not .Values.secrets.stringData.DATAFLOW_SECRETS_KEY }}
{{- fail "secrets.stringData.DATAFLOW_SECRETS_KEY is required when secrets.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataflow.secretName" . }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.stringData | nindent 2 }}
{{- end }}
