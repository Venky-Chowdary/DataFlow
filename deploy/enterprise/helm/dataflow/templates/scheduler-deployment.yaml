{{ if .Values.scheduler.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.fullname" . }}-scheduler
  labels:
    app.kubernetes.io/component: scheduler
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
      {{- include "dataflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
        {{- include "dataflow.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dataflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          command:
            - python
            - -m
            - src.scheduler_main
          env:
            {{- include "dataflow.commonEnv" . | nindent 12 }}
            - name: DATAFLOW_PROCESS_ROLE
              value: scheduler
            - name: DATAFLOW_WORKER_FLEET
              value: "1"
            - name: DATAFLOW_API_CLAIM_LOOP
              value: "0"
            - name: DATAFLOW_SCHEDULE_LOOP
              value: "1"
            - name: DATAFLOW_ACK_BACKEND
              value: mongo
          {{- include "dataflow.secretEnvFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.scheduler.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.scheduler.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.scheduler.affinity | nindent 8 }}
{{- end }}
