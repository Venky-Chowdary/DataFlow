# Incremental typing gate — Decision Kernel first (Migration Assurance Phase B8).
# Expand to type_system / engine / reconciliation as modules become clean.
[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
pretty = True
show_error_codes = True

[mypy-services.decision_kernel.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
# Do not type-check god-module imports from the kernel gate (engine/type_system).
follow_imports = skip

[mypy-services.type_system]
# Follow-imports=skip keeps the gate focused; widen when the module is decomposed.
follow_imports = skip
