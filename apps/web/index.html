    <script>
      /* Paint workspace theme before React so Settings Appearance does not flash. */
      (function () {
        try {
          var raw = localStorage.getItem("df2.theme");
          var pref = raw === "dark" || raw === "light" || raw === "system" ? raw : "light";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.classList.add("df2-theme-dark");
          }
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
