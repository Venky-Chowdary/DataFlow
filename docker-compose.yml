services:
  postgres:
    image: pgvector/pgvector:pg16
    # wal_level=logical + replication slots so Postgres CDC (logical decoding)
    # tests can create a real slot instead of mocking the decode stream.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # Cap retained WAL for idle CDC slots (Debezium-class operator safety).
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Search destination for the connector readiness matrix. Profile-gated because
  # a JVM node is the heaviest service here and most suites do not need it:
  # ``docker compose --profile search up -d elasticsearch``.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataflow
      MINIO_ROOT_PASSWORD: dataflowsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mysql:
    image: mysql:8.0
    # ROW-based binlog + a server id so MySQL CDC (binlog replication) tests can
    # attach a real stream, not just parse fixtures.
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: dataflow
      MYSQL_DATABASE: dataflow
      MYSQL_USER: dataflow
      MYSQL_PASSWORD: dataflow
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pdataflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: grant the app user what binlog CDC actually needs. MySQL requires
  # REPLICATION SLAVE to open a binlog stream and REPLICATION CLIENT to read
  # SHOW MASTER STATUS; RELOAD lets the snapshot take FLUSH TABLES WITH READ
  # LOCK instead of degrading to per-table locks. Without these, a CDC route
  # fails at stream open with "Access denied ... REPLICATION SLAVE" — which is
  # an environment gap, not a product defect, so the fleet grants them here.
  mysql-init:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mysql -h mysql -u root -pdataflow -e "
          GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'dataflow'@'%';
          FLUSH PRIVILEGES;"

  mongodb:
    image: mongo:7
    # Single-node replica set so Mongo change-stream (CDC) tests have an oplog.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: promote the mongo node to a replica set so change streams work.
  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          // Dual-access: host clients use localhost; in-network also works on
          // mapped 27017. Avoid hostname "mongodb" which breaks host→compose.
          // Comments must be JS: mongosh parses this string as JavaScript, and
          // a shell-style # made the whole eval a SyntaxError, so the node
          // stayed an uninitialised RSGhost and every Mongo route failed.
          try { rs.status(); }
          catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            });
          }
        '

  # SQL Server Change Tracking + native CDC for integration tests.
  # Auto-init after first boot (sqlserver-init). Manual: sqlserver_ct_init.sql + sqlserver_cdc_init.sql
  # On Apple Silicon, mssql/server:2022 crashes under QEMU (VA layout). Use profile
  # ``arm-sql`` → azure-sql-edge for batch SKU + Change Tracking; native CDC stays amd64 CI.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["amd64-sql"]
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataFlow_CDC_2022!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
      - ./apps/api/tests/sqlserver_ct_init.sql:/docker-init/sqlserver_ct_init.sql:ro
      - ./apps/api/tests/sqlserver_cdc_init.sql:/docker-init/sqlserver_cdc_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DataFlow_CDC_2022!' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["amd64-sql"]
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./apps/api/tests/sqlserver_ct_init.sql:/ct_init.sql:ro
      - ./apps/api/tests/sqlserver_cdc_init.sql:/cdc_init.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'DataFlow_CDC_2022!' -C -i /ct_init.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'DataFlow_CDC_2022!' -C -i /cdc_init.sql
        echo "sqlserver CT + native CDC init done"

  # Azure SQL Edge — arm64-friendly. Supports Change Tracking for local SKU;
  # does not replace full SQL Server native CDC proofs (use amd64-sql / CI).
  sqlserver-edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    profiles: ["arm-sql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataFlow_CDC_2022!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssqledgedata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # BigQuery emulator for always-on local warehouse SKU proofs without cloud creds.
  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command:
      - --project=dataflow-test
      - --dataset=dataflow
      - --log-level=error
    ports:
      - "9050:9050"
      - "9060:9060"

  # GCS-compatible emulator. Not a customer GCS tenant certificate.
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -public-host
      - localhost
      - -external-url
      - http://localhost:4443
    ports:
      - "4443:4443"

  # Azure Blob / ADLS Gen2 emulator. Not a customer ADLS tenant certificate.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"

  # DynamoDB Local for SKU routes that need a provisioned key schema.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

volumes:
  pgdata:
  miniodata:
  mongodata:
  mysqldata:
  mssqldata:
  mssqledgedata:
