name: PR Workflow

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_call:
    secrets:
      DATAFLOW_ORACLE_HOST:
        required: false
      DATAFLOW_ORACLE_PORT:
        required: false
      DATAFLOW_ORACLE_SERVICE:
        required: false
      DATAFLOW_ORACLE_USER:
        required: false
      DATAFLOW_ORACLE_PASSWORD:
        required: false
      DATAFLOW_ORACLE_SCHEMA:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A push that changes only the web app reuses the backend checks of the
  # newest ancestor whose backend jobs all passed (.github/scripts/ci_backend_reuse.py).
  # Any change outside apps/web, packages/design-system, the npm manifests or
  # Markdown runs everything. The gate below accepts a skipped backend job only
  # when this job said reuse=true.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      from: ${{ steps.decide.outputs.from }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the backend checks of a green ancestor?
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_backend_reuse.py

  # Lean evidence pack — no databases. Regenerates claim→metric catalog and
  # fails when marketing floors exceed measured fixture proofs.
  mapping-evidence:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API + preflight
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -e packages/preflight

      - name: Build evidence catalog
        env:
          PYTHONPATH: apps/api:packages/preflight/src
        run: |
          python apps/api/scripts/run_evidence_pack.py --refresh-pairs --fail-on-miss
          echo "### Mapping evidence pack" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          cat = json.loads(Path("apps/api/data/proofs/evidence_catalog.json").read_text())
          print(f"- **{'PASS' if cat['all_passed'] else 'FAIL'}** — {cat['passed_count']}/{cat['claim_count']} claims")
          for c in cat["claims"]:
              mark = "ok" if c["passed"] else "MISS"
              print(f"- `{c['id']}`: {mark}")
          print()
          print("Artifact: `apps/api/data/proofs/EVIDENCE_CATALOG.md`")
          PY

      - name: Evidence pack pytest gate
        working-directory: apps/api
        env:
          PYTHONPATH: .:../../packages/preflight/src
        run: |
          python -m pytest tests/test_evidence_pack.py -q --tb=short

      - name: God-module size budgets (Phase F8)
        working-directory: apps/api
        run: |
          python scripts/check_module_size_budgets.py
          python scripts/connector_capability_matrix_report.py

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-evidence-catalog
          path: |
            apps/api/data/proofs/evidence_catalog.json
            apps/api/data/proofs/EVIDENCE_CATALOG.md
            apps/api/data/proofs/abbreviation_coverage.json
            apps/api/data/proofs/mapping_connector_pair_matrix/
            apps/api/data/proofs/module_size_budgets.json
            apps/api/data/proofs/connector_capability_matrix.json

  # AI ITEM 1 — full Map/LLM suite with no network and no API keys.
  # Proves offline claim: LLM cannot change mapping decisions / checksums.
  ai-offline-correctness:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Offline LLM-off correctness (ITEM 1)
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          # Empty keys + unreachable Ollama — no network LLM. Policy-off is
          # asserted inside test_offline_env_forces_llm_policy_off; mock tests
          # patch is_llm_enabled when they need the suggest path.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OLLAMA_HOST: "http://127.0.0.1:9"
        run: |
          python -m pytest \
            tests/test_item1_llm_never_correctness_path.py \
            tests/test_llm_mapping.py \
            -q --tb=short

  # Data Pilot answer floors: local engine only, no network LLM. The provider
  # eval skips here (no key) — run it by hand with DATAFLOW_PILOT_EVAL_PROVIDER.
  # The test_pilot_truth_* files are the ground-truth suite: each case seeds
  # real jobs / pipelines / connectors / uploads (tests/helpers/pilot_truth.py),
  # asks Pilot, and requires the numbers and ids in the answer to equal what
  # the stores say — plus outage honesty, abstention, workspace isolation,
  # error masking and AI egress. All of it runs offline.
  pilot-answer-quality:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Pilot policy, retrieval, narration guards and answer audit
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OLLAMA_HOST: "http://127.0.0.1:9"
        run: |
          python -m pytest \
            tests/test_pilot_answer_audit_eval.py \
            tests/test_pilot_provider_eval.py \
            tests/test_pilot_intent_policy.py \
            tests/test_pilot_lifecycle_tools.py \
            tests/test_pilot_native_loop_guards.py \
            tests/test_pilot_tool_permissions.py \
            tests/test_rag_grounded_answers.py \
            tests/test_rag_multi_subject_answers.py \
            tests/test_pilot_truth_jobs.py \
            tests/test_pilot_truth_totals.py \
            tests/test_pilot_truth_outage.py \
            tests/test_pilot_truth_abstention.py \
            tests/test_pilot_truth_isolation.py \
            tests/test_pilot_truth_datasets.py \
            tests/test_pilot_truth_result_store.py \
            tests/test_pilot_truth_errors.py \
            tests/test_pilot_truth_egress.py \
            tests/test_pilot_truth_windows.py \
            tests/test_pilot_truth_status.py \
            tests/test_pilot_truth_pipelines.py \
            tests/test_pilot_truth_narration.py \
            tests/test_pilot_truth_followups.py \
            tests/test_pilot_truth_injection.py \
            tests/test_pilot_truth_latency.py \
            tests/test_pilot_truth_lows.py \
            tests/test_pilot_truth_qualifiers.py \
            tests/test_pilot_truth_dst.py \
            tests/test_pilot_truth_dates.py \
            tests/test_pilot_truth_intersection.py \
            tests/test_pilot_truth_compound.py \
            tests/test_pilot_truth_memory.py \
            tests/test_pilot_truth_lows2.py \
            tests/test_pilot_truth_mutants.py \
            -q --tb=short -rs

  # Property 2 — no-config transfer must never be blocked by additive/DDL gates.
  # Services make the full golden matrix (PG/MySQL/Mongo) runnable with zero skips.
  no-config-transfer:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # No `services:` — a public.ecr.aws/docker.io rate-limit on a service
    # container aborts the job before checkout with no retry. Postgres starts
    # in a step via start_ci_databases.sh, which retries pulls with backoff
    # and falls back to the other registry.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Service containers cannot take a command line, so MySQL (local_infile
      # for LOAD DATA LOCAL) and Mongo (--replSet for snapshot reads, as in
      # docker-compose.yml) are started in steps that mirror production.
      # Postgres joins the same script: a `services:` pull has no registry
      # fallback — a rate-limit there aborted the job before checkout.
      - name: Start Postgres, MySQL (local_infile) and Mongo replica set
        run: |
          bash .github/scripts/start_ci_databases.sh postgres mysql mongo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Golden-path no-config transfer (Property 2)
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          P2_PG_HOST: 127.0.0.1
          P2_PG_PORT: "5432"
          P2_PG_DB: dataflow
          P2_PG_USER: dataflow
          P2_PG_PASSWORD: dataflow
          P2_MYSQL_HOST: 127.0.0.1
          P2_MYSQL_PORT: "3306"
          P2_MYSQL_DB: dataflow
          P2_MYSQL_USER: dataflow
          P2_MYSQL_PASSWORD: dataflow
          P2_MONGO_URI: mongodb://127.0.0.1:27017
        run: |
          # Any golden-path skip fails the job (services must be up): the
          # shared live-engine checker, manifest entry `no-config-transfer`.
          set +e
          python -m pytest tests/test_property2_golden_path_never_blocked.py -q --tb=short -rs \
            --junitxml="$RUNNER_TEMP/live-junit/golden-path.xml"
          rc=$?
          set -e
          python scripts/check_live_skips.py --job no-config-transfer --junit "$RUNNER_TEMP/live-junit/golden-path.xml" --out "$RUNNER_TEMP/live-engine/no-config-transfer.json"
          exit "$rc"

      - name: Upload live-engine result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-no-config-transfer
          path: ${{ runner.temp }}/live-engine/
          if-no-files-found: warn

  # Fast GitOps gate — no databases. Validates example manifest + CLI plan/apply proofs.
  gitops:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps (CLI --local imports services.*)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Validate example dataflow.yaml
        run: |
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli validate -f examples/gitops/dataflow.yaml
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli validate -f examples/gitops/dataflow.staging.yaml

      - name: Plan example manifest (local stores)
        env:
          DATAFLOW_DATA_DIR: ${{ runner.temp }}/dataflow-gitops
          DATAFLOW_JOB_STORE: memory
        run: |
          mkdir -p "$DATAFLOW_DATA_DIR"
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli plan -f examples/gitops/dataflow.yaml --local
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli plan -f examples/gitops/dataflow.staging.yaml --local

      - name: GitOps unit proofs
        env:
          DATAFLOW_DATA_DIR: ${{ runner.temp }}/dataflow-gitops-tests
          DATAFLOW_JOB_STORE: memory
        run: |
          mkdir -p "$DATAFLOW_DATA_DIR"
          cd apps/api
          python -m pytest tests/test_gitops_plan_apply.py tests/test_dataflow_cli.py tests/test_enterprise_p0_p2.py::test_gitops_manifest_shape -q --tb=short

  # The API suite (~2,400 files) in parallel shards: one job ran past GitHub's
  # 6-hour job limit. A file's shard is a stable hash of its path
  # (tests/conftest.py::_select_ci_shard), so each file runs exactly once.
  api-tests:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: api-tests (${{ matrix.shard }}/6)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start CI services + install Python deps
        uses: ./.github/actions/ci-services

      - name: Run API tests
        # The log is tee'd so the failing test ids can be listed again at the end
        # of the job (the step output is tens of thousands of lines long).
        working-directory: apps/api
        run: |
          set -o pipefail
          python -m pytest tests -v --timeout=900 \
            --junitxml="$RUNNER_TEMP/live-junit/api-tests.xml" 2>&1 | tee "$RUNNER_TEMP/api_tests.log"
        env:
          DATAFLOW_TEST_SHARD: ${{ matrix.shard }}/6
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"
          DATAFLOW_FAKESNOW_KEEP_PATCH: "1"
          # Wall-clock throughput guard in tests/test_scale_transfer.py: the shared
          # runner needs ~140s for 100k rows, the same code takes ~130s on a
          # workstation (production's code: identical), so the 120s default is a
          # local-machine figure. Owner-visible; not a product budget.
          DATAFLOW_SCALE_MAX_SEC: "300"
          # No background Training Agent inside TestClient lifespans (tests/conftest.py
          # sets the same default; this keeps it off even if that changes).
          DATAFLOW_TRAINING: "off"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: dataflow
          PGPASSWORD: dataflow
          PGDATABASE: dataflow

      - name: Failing API test ids
        if: ${{ !cancelled() && (success() || failure()) }}
        run: |
          echo "### Failing API tests (shard ${{ matrix.shard }}/6)" >> "$GITHUB_STEP_SUMMARY"
          grep -hE '^(FAILED|ERROR) ' "$RUNNER_TEMP/api_tests.log" | cut -c1-400 | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || echo "none" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -hE '[0-9]+ (passed|failed)' "$RUNNER_TEMP/api_tests.log" | tail -2 || true

      - name: No live-engine test may skip (engine-scoped)
        # A skip whose message names PostgreSQL, MySQL, Mongo or Redis (which
        # this job starts) fails the shard, even when it also names an engine
        # the job lacks, unless it is an expected skip in
        # apps/api/scripts/live_engine_jobs.json
        # (`api-tests`). BigQuery / GCS / ADLS emulator skips are counted and
        # published but do not fail yet (report_engines).
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          python scripts/check_live_skips.py --job api-tests --label shard=${{ matrix.shard }} --junit "$RUNNER_TEMP/live-junit/api-tests.xml" --out "$RUNNER_TEMP/live-engine/api-tests-${{ matrix.shard }}.json"

      - name: Upload live-engine result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-api-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/live-engine/
          if-no-files-found: warn

  api-and-web:
    runs-on: ubuntu-latest
    # Gates on the API shards, and still runs (and fails) when one of them failed.
    needs: [changes, api-tests]
    if: ${{ !cancelled() }}
    # No service containers. Redis used to be one; a Docker Hub
    # "toomanyrequests" pull failed Initialize containers, skipped Checkout,
    # and every later `npm` step exited 254 because package.json was absent.
    # MySQL, Mongo, Redis, fake-gcs, and Azurite start in a step so a pull
    # can fall back to a second registry. Postgres is built from
    # Dockerfile.postgres-cdc so wal_level=logical is on for CDC tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node deps install right after checkout: the web test/build steps run under
      # `failure()` too, so when a database-image pull below fails they still run and
      # need node_modules (otherwise `tsc` reports TS2307 Cannot find module 'react').
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Start CI services + install Python deps
        if: ${{ needs.changes.outputs.reuse != 'true' }}
        uses: ./.github/actions/ci-services

      # The API suite runs in the api-tests shards above; preflight stays here.
      - name: Preflight package tests
        if: ${{ needs.changes.outputs.reuse != 'true' }}
        id: preflight_tests
        run: npm run test:preflight

      # Phase B9 — proof steps MUST run even when a test step fails (audit §3.2).
      # Never silently omit CDC / warehouse evidence from the CI record.
      - name: CDC matrix report
        if: ${{ (!cancelled() && (success() || failure())) && needs.changes.outputs.reuse != 'true' }}
        id: cdc_matrix
        run: npm run test:cdc
        env:
          CDC_MATRIX_JUNIT: ${{ runner.temp }}/live-junit/cdc-matrix.xml
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: dataflow
          PGPASSWORD: dataflow
          PGDATABASE: dataflow
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow
          DATAFLOW_CDC_LEASE_BACKEND: redis
          DATAFLOW_CDC_LEASE_REDIS_URL: redis://127.0.0.1:6379/15

      - name: CDC matrix live-engine skips
        if: ${{ (!cancelled() && (success() || failure())) && needs.changes.outputs.reuse != 'true' }}
        id: cdc_skips
        working-directory: apps/api
        run: |
          python scripts/check_live_skips.py --job cdc-matrix --junit "$RUNNER_TEMP/live-junit/cdc-matrix.xml" --out "$RUNNER_TEMP/live-engine/cdc-matrix.json"

      - name: Warehouse SKU proof report
        if: ${{ (!cancelled() && (success() || failure())) && needs.changes.outputs.reuse != 'true' }}
        id: warehouse_sku
        # Always-on Snowflake (fakesnow) + BigQuery (goccy emulator) proof.
        # SaaS reverse-ETL destinations (Salesforce/HubSpot) skip without creds.
        working-directory: apps/api
        run: |
          # Fresh emulator process + catalog: the api slice's DROP history must
          # not be able to corrupt the proof run (see start_bigquery).
          docker logs --tail 40 dataflow-bigquery-emulator 2>&1 | grep -c panic \
            | sed 's/^/emulator panics logged during api slice: /' || true
          bash ../../.github/scripts/start_ci_databases.sh bigquery
          set +e
          WAREHOUSE_SKU_JUNIT="$RUNNER_TEMP/live-junit/warehouse-sku.xml" python scripts/warehouse_sku_report.py
          code=$?
          docker inspect dataflow-bigquery-emulator --format 'emulator restarts={{.RestartCount}} state={{.State.Status}} started={{.State.StartedAt}}' || true
          docker logs --tail 80 dataflow-bigquery-emulator || true
          echo "### Warehouse SKU proof" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/proofs/warehouse_sku_report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/proofs/warehouse_sku_report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- **{'PASS' if d.get('exit_code') == 0 else 'FAIL'}** — {d.get('passed', 0)} passed, {d.get('failed', 0)} failed, {d.get('skipped', 0)} skipped")
          for reason in d.get("skip_reasons") or []:
              print(f"- skip: {reason}")
          print("- Artifact: `apps/api/data/proofs/warehouse_sku_report.json`")
          PY
          else
            echo "- **NO ARTIFACT** — warehouse_sku_report.py did not write proof JSON" >> "$GITHUB_STEP_SUMMARY"
            code=1
          fi
          exit $code
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"
          DATAFLOW_FAKESNOW_KEEP_PATCH: "1"

      - name: Warehouse SKU live-engine skips
        if: ${{ (!cancelled() && (success() || failure())) && needs.changes.outputs.reuse != 'true' }}
        id: warehouse_skips
        working-directory: apps/api
        run: |
          python scripts/check_live_skips.py --job warehouse-sku --junit "$RUNNER_TEMP/live-junit/warehouse-sku.xml" --out "$RUNNER_TEMP/live-engine/warehouse-sku.json"

      - name: Upload live-engine results (CDC matrix, warehouse SKU)
        if: ${{ (always()) && needs.changes.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-api-and-web
          path: ${{ runner.temp }}/live-engine/
          if-no-files-found: warn

      - name: TRANSFER_READY certification matrix
        if: ${{ (!cancelled() && (success() || failure())) && needs.changes.outputs.reuse != 'true' }}
        id: transfer_ready_matrix
        # Phase E2 — publish PRODUCTION_SKU × unique_drivers honesty artifact.
        working-directory: apps/api
        run: |
          python scripts/transfer_ready_matrix_report.py
          echo "### TRANSFER_READY matrix" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/proofs/transfer_ready_matrix.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- unique_drivers: {d.get('unique_driver_count')}")
          print(f"- PRODUCTION_SKU routes: {d.get('production_sku_route_count')}")
          print("- Artifact: `apps/api/data/proofs/transfer_ready_matrix.json`")
          PY

      - name: Upload migration proof artifacts
        if: ${{ (always()) && needs.changes.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-proof-ci
          if-no-files-found: warn
          path: |
            apps/api/data/proofs/cdc_matrix_report.json
            apps/api/data/proofs/warehouse_sku_report.json
            apps/api/data/proofs/transfer_ready_matrix.json

      - name: Frontend unit contracts
        id: frontend_tests
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run test:web

      - name: Build web
        id: web_build
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run build

      - name: Frontend chunk budgets (Phase F9)
        id: chunk_budgets
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' }}
        working-directory: apps/web
        run: node scripts/check_chunk_budgets.mjs

      - name: Bundle carries no old brand or hosting hostname (QA r12 #4b)
        id: bundle_brand
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' }}
        working-directory: apps/web
        run: node scripts/check_bundle_brand.mjs

      - name: "!important ratchet (cascade budget)"
        id: important_budget
        if: ${{ !cancelled() && (success() || failure()) }}
        working-directory: apps/web
        run: node scripts/check_important_budget.mjs

      - name: a11y + raw-hex ratchet (audit P1-5/P2-6)
        id: a11y_hex
        if: ${{ !cancelled() && (success() || failure()) }}
        working-directory: apps/web
        run: node scripts/check_a11y_hex.mjs

      # Surface which gate failed when earlier steps failed but proofs still ran.
      - name: Fail job if api tests or proof gates failed
        if: ${{ always() && !cancelled() }}
        run: |
          api="${{ needs.api-tests.result }}"
          if [ "$api" = "skipped" ] && [ "${{ needs.changes.outputs.reuse }}" = "true" ]; then
            api="success"  # reused from ${{ needs.changes.outputs.from }} (web-only change)
          fi
          pre="${{ steps.preflight_tests.outcome }}"
          cdc="${{ steps.cdc_matrix.outcome }}"
          cdcskip="${{ steps.cdc_skips.outcome }}"
          wh="${{ steps.warehouse_sku.outcome }}"
          whskip="${{ steps.warehouse_skips.outcome }}"
          trm="${{ steps.transfer_ready_matrix.outcome }}"
          fe="${{ steps.frontend_tests.outcome }}"
          web="${{ steps.web_build.outcome }}"
          # A budget that cannot fail the job is not a budget: chunk_budgets ran
          # but its outcome was never read, so an oversized bundle merged green.
          chunks="${{ steps.chunk_budgets.outcome }}"
          imp="${{ steps.important_budget.outcome }}"
          a11y="${{ steps.a11y_hex.outcome }}"
          brand="${{ steps.bundle_brand.outcome }}"
          echo "bundle_brand=$brand"
          echo "api_tests=$api cdc_matrix=$cdc warehouse_sku=$wh transfer_ready_matrix=$trm frontend=$fe web_build=$web chunk_budgets=$chunks important_budget=$imp a11y_hex=$a11y"
          fail=0
          echo "cdc_live_skips=$cdcskip warehouse_live_skips=$whskip"
          for name_out in "api_tests:$api" "preflight_tests:$pre" "cdc_matrix:$cdc" "cdc_live_skips:$cdcskip" "warehouse_sku:$wh" "warehouse_live_skips:$whskip" "transfer_ready_matrix:$trm" "frontend_tests:$fe" "web_build:$web" "chunk_budgets:$chunks" "important_budget:$imp" "a11y_hex:$a11y" "bundle_brand:$brand"; do
            name="${name_out%%:*}"
            out="${name_out##*:}"
            # skipped only acceptable when job cancelled mid-flight; otherwise require success.
            # A web-only change reuses the backend proofs (changes job), so those steps skip.
            if [ "$out" = "skipped" ] && [ "${{ needs.changes.outputs.reuse }}" = "true" ] \
              && [[ " preflight_tests cdc_matrix cdc_live_skips warehouse_sku warehouse_live_skips transfer_ready_matrix " == *" $name "* ]]; then
              continue
            fi
            if [ "$out" != "success" ]; then
              fail=1
            fi
          done
          echo "### Merge gate (B9)" >> "$GITHUB_STEP_SUMMARY"
          echo "- api_tests: \`$api\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- preflight_tests: \`$pre\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cdc_matrix: \`$cdc\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cdc_live_skips: \`$cdcskip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- warehouse_live_skips: \`$whskip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- warehouse_sku: \`$wh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- transfer_ready_matrix: \`$trm\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_tests: \`$fe\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- web_build: \`$web\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- chunk_budgets: \`$chunks\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- important_budget: \`$imp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- a11y_hex: \`$a11y\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundle_brand: \`$brand\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "Red CI blocks merge — fix failing gates before claiming production readiness." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- All required gates green (api + CDC + warehouse SKU + TRANSFER_READY matrix + frontend + web build + chunk budgets)." >> "$GITHUB_STEP_SUMMARY"

  # SQL Server live proof: Change Tracking + native CDC (SQL Server Agent on),
  # the PRODUCTION_SKU SQL Server routes and the SQL Server cells of the
  # universal matrix whose peer engine this job starts. Separate job: the
  # SQL Server image is large/slow; keep the API shards lean.
  #
  # Until this job was rewired every live test here skipped in seconds: no
  # SA password reached pytest (DATAFLOW_TEST_MSSQL_PASSWORD / _SQLSERVER_
  # PASSWORD were never set), Agent was off (capture jobs cannot run), the
  # native CDC readiness probe had no TLS trust for the self-signed lab
  # certificate under Driver 18, and `pytest | tee` without pipefail could
  # not fail the step.
  #
  # Two legs, one per SQL Server DBAPI. Production (Dockerfile.api) ships
  # unixODBC but no Microsoft ODBC driver, so the product dials SQL Server
  # through pymssql (FreeTDS) there; the pymssql leg reproduces that (no
  # Microsoft driver registered) and asserts the product picked pymssql. The
  # pyodbc leg proves the ODBC Driver 18 path operators can opt into.
  cdc-sqlserver:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    name: cdc-sqlserver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        driver: [pyodbc, pymssql]
    env:
      SQLSERVER_LEG: ${{ matrix.driver }}
      # FreeTDS cannot honour Encrypt=yes and the product refuses it rather
      # than pretend, so the pymssql leg's matrix template declares none.
      DATAFLOW_TEST_MSSQL_ENCRYPT: ${{ matrix.driver == 'pyodbc' && 'yes' || '' }}
      DATAFLOW_JOB_STORE: memory
      DATAFLOW_DISABLE_OBJECT_STORE: "1"
      DATAFLOW_PII_HASH_KEY: test-pii-key
      DATAFLOW_ALLOW_STUB_WRITES: "1"
      DATAFLOW_TRAINING: "off"
      DATAFLOW_CDC_LEASE_BACKEND: memory
      # SQL Server. The password is NOT here: a per-run value is generated
      # and masked in the first step (throwaway container, no stored secret).
      DATAFLOW_SQLSERVER_ENABLE: "1"
      DATAFLOW_SQLSERVER_HOST: localhost
      DATAFLOW_SQLSERVER_PORT: "1433"
      DATAFLOW_SQLSERVER_DATABASE: dataflow
      DATAFLOW_SQLSERVER_USER: sa
      DATAFLOW_TEST_MSSQL_HOST: 127.0.0.1
      DATAFLOW_TEST_MSSQL_PORT: "1433"
      DATAFLOW_TEST_MSSQL_DB: dataflow
      DATAFLOW_TEST_MSSQL_USER: sa
      # Postgres peer (Dockerfile.postgres-cdc: pgvector + wal_level=logical).
      # CI-only container credentials, same as every other job.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: dataflow
      PGPASSWORD: dataflow
      PGDATABASE: dataflow
      DATAFLOW_PG_HOST: 127.0.0.1
      DATAFLOW_PG_PORT: "5432"
      DATAFLOW_PG_DB: dataflow
      DATAFLOW_PG_USER: dataflow
      DATAFLOW_PG_PASSWORD: dataflow
      # MySQL peer (start_ci_databases.sh mysql grants dataflow CDC rights).
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: dataflow
      MYSQL_USER: dataflow
      MYSQL_PASSWORD: dataflow
      DATAFLOW_MYSQL_HOST: 127.0.0.1
      DATAFLOW_MYSQL_PORT: "3306"
      DATAFLOW_MYSQL_DB: dataflow
      DATAFLOW_MYSQL_USER: dataflow
      DATAFLOW_MYSQL_PASSWORD: dataflow
      DATAFLOW_TEST_MYSQL_HOST: 127.0.0.1
      DATAFLOW_TEST_MYSQL_PORT: "3306"
      DATAFLOW_TEST_MYSQL_DB: dataflow
      DATAFLOW_TEST_MYSQL_USER: dataflow
      DATAFLOW_TEST_MYSQL_PASSWORD: dataflow
    # No `services:` — a registry rate-limit on a service container aborts the
    # job before checkout; start_ci_databases.sh retries pulls with backoff.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate a per-run SQL Server SA password (masked)
        run: |
          # Meets the SQL Server policy (upper, lower, digit, symbol). Masked
          # before it is written anywhere; lives only for this run's container.
          pw="Ci1-$(openssl rand -hex 16)-Zz"
          echo "::add-mask::${pw}"
          {
            echo "MSSQL_SA_PASSWORD=${pw}"
            echo "DATAFLOW_TEST_MSSQL_PASSWORD=${pw}"
            echo "DATAFLOW_SQLSERVER_PASSWORD=${pw}"
          } >> "$GITHUB_ENV"

      - name: Start MySQL, Postgres (logical CDC) and SQL Server (Agent on, CT + CDC init)
        run: |
          bash .github/scripts/start_ci_databases.sh mysql postgres-cdc sqlserver

      # Python setup runs even when an engine failed to start (PR 424 CI: the
      # start step failed, setup was skipped, and the `!cancelled()` pytest
      # steps ran on /usr/bin/python with no pytest, 0 executed).
      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: The test interpreter has pytest and both SQL Server DBAPIs
        id: python_ready
        if: ${{ !cancelled() }}
        run: |
          command -v python
          python -c "import pytest, pymssql, pyodbc; print('pytest', pytest.__version__, 'pymssql', pymssql.__version__)"

      - name: Install Microsoft ODBC Driver 18 (fails when pyodbc cannot see it)
        if: ${{ !cancelled() && matrix.driver == 'pyodbc' }}
        run: bash .github/scripts/install_msodbcsql18.sh

      - name: Assert the product dials SQL Server through ${{ matrix.driver }}
        if: ${{ !cancelled() && steps.python_ready.outcome == 'success' }}
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          import sys

          from connectors.generic_sql import _mssql_drivername

          want = "mssql+" + os.environ["SQLSERVER_LEG"]
          got = _mssql_drivername()
          print(f"SQL Server DBAPI in use: {got} (leg wants {want})")
          sys.exit(0 if got == want else 1)
          PY

      - name: SQL Server CDC — Change Tracking, native CDC, CDC transfers
        id: sqlserver_cdc
        if: ${{ !cancelled() && steps.python_ready.outcome == 'success' }}
        working-directory: apps/api
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-junit"
          # D196 / D203 seed their source rows through pyodbc + ODBC Driver 18
          # (test fixtures, not the product path), so they run in the pyodbc
          # leg; the product's CT / native CDC paths run in both legs.
          odbc_fixture_tests=()
          if [ "$SQLSERVER_LEG" = pyodbc ]; then
            odbc_fixture_tests=(
              tests/test_d196_sqlserver_change_tracking_cdc_live.py
              tests/test_d203_sqlserver_native_cdc_null_live.py
            )
          fi
          python -m pytest \
            tests/test_cdc_sqlserver_ct_integration.py \
            tests/test_cdc_sqlserver_native_integration.py \
            tests/test_cdc_sqlserver_native_transfer_e2e.py \
            tests/test_cdc_sqlserver_capture_removal.py \
            tests/test_cdc_sqlserver_capture_switch.py \
            "${odbc_fixture_tests[@]}" \
            tests/test_r12_d249_cdc_eos_sqlserver_fractional_bind.py \
            tests/test_cdc_sqlserver_connection_options.py \
            tests/test_cdc_sqlserver_live_helpers.py \
            tests/test_sqlserver_native_cdc.py \
            tests/test_sqlserver_oracle_cdc.py \
            tests/test_c3_lossy_pairs_sqlserver_live.py \
            -v --tb=short -rs \
            --junitxml="$RUNNER_TEMP/live-junit/sqlserver-cdc.xml"

      - name: SQL Server CDC — exactly-once apply (live)
        id: sqlserver_cdc_eos
        if: ${{ !cancelled() && steps.python_ready.outcome == 'success' }}
        working-directory: apps/api
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-junit"
          python -m pytest tests/test_cdc_exactly_once_live_engines.py \
            -k sqlserver -v --tb=short -rs \
            --junitxml="$RUNNER_TEMP/live-junit/sqlserver-cdc-eos.xml"

      - name: SQL Server SKU + matrix routes (peers started in this job)
        id: sqlserver_matrix
        if: ${{ !cancelled() && steps.python_ready.outcome == 'success' }}
        # PRODUCTION_SKU routes (PG <-> SQL Server, MySQL -> SQL Server) and the
        # universal-matrix cells pairing SQL Server with an engine this job
        # starts: PostgreSQL, pgvector, MySQL, SQLite, generic_sql (SQLite
        # file), every file format, and SQL Server itself. Cells whose peer
        # has no emulator here (SaaS, Oracle, Kafka, cloud stores, vector
        # DBs) are deselected, not skipped: they are not this job's claim.
        working-directory: apps/api
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/live-junit"
          python -m pytest \
            tests/test_production_sku_matrix.py \
            tests/test_execute_tracked_universal_matrix.py \
            -k "sqlserver and (postgresql or pgvector or mysql or sqlite or generic_sql or file_ or sqlserver_to_database_sqlserver)" \
            -v --tb=short -rs --durations=20 \
            --junitxml="$RUNNER_TEMP/live-junit/sqlserver-matrix.xml"

      - name: No SQL Server live test may skip
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          python scripts/check_live_skips.py --job cdc-sqlserver --label driver=${{ matrix.driver }} --junit "$RUNNER_TEMP/live-junit/sqlserver-cdc.xml" --junit "$RUNNER_TEMP/live-junit/sqlserver-cdc-eos.xml" --junit "$RUNNER_TEMP/live-junit/sqlserver-matrix.xml" --out "$RUNNER_TEMP/live-engine/cdc-sqlserver-${{ matrix.driver }}.json"

      - name: Upload SQL Server junit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-live-junit-${{ matrix.driver }}
          path: ${{ runner.temp }}/live-junit/
          if-no-files-found: warn

      - name: Upload live-engine result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-cdc-sqlserver-${{ matrix.driver }}
          path: ${{ runner.temp }}/live-engine/
          if-no-files-found: warn

  # Optional live IT: enable via repo variable ENABLE_ORACLE_CDC=true plus the
  # DATAFLOW_ORACLE_* secrets. The job always runs so the opt-out is a visible
  # skip reason, not an absent job.
  # CLM-5: an Oracle job whose every live step skipped used to finish green.
  # Opt-in now happens at the job: without ENABLE_ORACLE_CDC=true the job is
  # *skipped* (grey, never a green check), and live-engine-evidence records
  # Oracle as not_run. Enabled without the password secret is a broken
  # setup and fails; enabled and configured, every step runs and the strict
  # skip checker fails any skipped Oracle test.
  cdc-oracle:
    if: ${{ vars.ENABLE_ORACLE_CDC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the Oracle password secret
        env:
          DATAFLOW_ORACLE_PASSWORD: ${{ secrets.DATAFLOW_ORACLE_PASSWORD }}
        run: |
          if [ -z "${DATAFLOW_ORACLE_PASSWORD}" ]; then
            echo "ENABLE_ORACLE_CDC is 'true' but DATAFLOW_ORACLE_PASSWORD is unset: Oracle cannot be proven" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps + Oracle client
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install oracledb

      - name: Run Oracle CDC live IT
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_cdc_oracle_integration.py \
            tests/test_sqlserver_oracle_cdc.py \
            tests/test_c3_lossy_pairs_oracle_live.py \
            -v --tb=short -rs \
            --junitxml="$RUNNER_TEMP/live-junit/oracle-cdc.xml"
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_ORACLE_ENABLE: "1"
          DATAFLOW_ORACLE_HOST: ${{ secrets.DATAFLOW_ORACLE_HOST }}
          DATAFLOW_ORACLE_PORT: ${{ secrets.DATAFLOW_ORACLE_PORT }}
          DATAFLOW_ORACLE_SERVICE: ${{ secrets.DATAFLOW_ORACLE_SERVICE }}
          DATAFLOW_ORACLE_USER: ${{ secrets.DATAFLOW_ORACLE_USER }}
          DATAFLOW_ORACLE_PASSWORD: ${{ secrets.DATAFLOW_ORACLE_PASSWORD }}
          DATAFLOW_ORACLE_SCHEMA: ${{ secrets.DATAFLOW_ORACLE_SCHEMA }}

      - name: No Oracle live test may skip
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          python scripts/check_live_skips.py --job cdc-oracle --junit "$RUNNER_TEMP/live-junit/oracle-cdc.xml" --out "$RUNNER_TEMP/live-engine/cdc-oracle.json"

      - name: Upload live-engine result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-cdc-oracle
          path: ${{ runner.temp }}/live-engine/
          if-no-files-found: warn

  # A4: which engines CI actually ran green. Merges the live-engine results
  # (scripts/check_live_skips.py) into connector_ci_evidence.json, the file
  # the connector capability page reads. Configuration alone never makes an
  # engine "live-verified". Reporting only: the proving jobs carry the gate.
  live-engine-evidence:
    name: Connector CI evidence
    # api-tests proves PostgreSQL / MySQL / Mongo / Redis and the in-process
    # engines; without it in needs, its results could be missing here.
    needs: [changes, no-config-transfer, api-tests, cdc-sqlserver, cdc-oracle, api-and-web]
    if: ${{ always() && !cancelled() && needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download live-engine results
        uses: actions/download-artifact@v4
        with:
          pattern: live-engine-*
          path: ${{ runner.temp }}/live-engine
          merge-multiple: true

      - name: Record that the opt-in Oracle job did not run
        # The skipped cdc-oracle job wrote nothing. Stdlib only. The evidence
        # file then says "not_run", and nothing may call Oracle proven.
        if: ${{ needs.cdc-oracle.result == 'skipped' }}
        run: |
          mkdir -p "$RUNNER_TEMP/live-engine"
          python3 apps/api/scripts/check_live_skips.py --job cdc-oracle --not-run "ENABLE_ORACLE_CDC is not 'true'" --out "$RUNNER_TEMP/live-engine/cdc-oracle.json"

      - name: Build connector CI evidence (stdlib only)
        run: |
          python3 apps/api/scripts/connector_ci_evidence_report.py --results "$RUNNER_TEMP/live-engine" --out "$RUNNER_TEMP/connector-ci-evidence/connector_ci_evidence.json"

      - name: Upload connector CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: connector-ci-evidence
          path: ${{ runner.temp }}/connector-ci-evidence/connector_ci_evidence.json
          if-no-files-found: error

      # Last step on purpose: these lines sit at the end of the job log, so the
      # snapshot can be refreshed from them without downloading the artifact.
      - name: Print the per-job live-engine results
        run: |
          for f in "$RUNNER_TEMP"/live-engine/*.json; do
            python3 -c 'import json,sys; print("DW-LIVE-RESULT", json.dumps(json.load(open(sys.argv[1])), separators=(",", ":"), sort_keys=True))' "$f"
          done

  security:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools and default API deps
        run: |
          python -m pip install --upgrade pip pip-audit bandit ruff mypy
          # Locked like the image, so the licence gate's bundled-library scan
          # sees exactly the wheels Dockerfile.api installs.
          python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-image.txt

      - name: Ruff baseline (Phase B8 allowlist)
        # Start narrow — BLE001/S110/DTZ001/F401 on Decision Kernel + Phase A/B paths.
        # Expand allowlist as modules are cleaned; full tree is not yet green.
        working-directory: apps/api
        run: >
          ruff check
          --config ruff.toml
          services/decision_kernel
          services/auth_rate_limit.py
          services/auto_create_lifecycle.py
          services/staging_reaper.py
          services/control_totals.py
          src/services/auth_service.py
          connectors/elasticsearch_writer.py
          connectors/sqlite_writer.py
          src/ai/rag/evidence.py
          src/ai/rag/generator.py
          src/ai/copilot/intent_policy.py
          src/ai/copilot/tool_permissions.py
          src/ai/first_party/intent_router.py
          src/ai/first_party/intent_labels.py

      - name: No undefined names anywhere in the API (D119)
        # ``name 'ci_get' is not defined`` reached production; F821/F822/F823
        # over the whole tree (tests included) is green and must stay so.
        working-directory: apps/api
        run: ruff check --config ruff.toml --select F821,F822,F823 .

      - name: Mypy Decision Kernel (Phase B8)
        # Strict on services.decision_kernel; type_system follows as a skip-import smoke.
        working-directory: apps/api
        run: |
          # One invocation: with --follow-imports=skip, anything not named here
          # resolves to Any, so checking type_system apart from the modules it
          # delegates to left every invent path unchecked in both directions.
          python -m mypy --config-file mypy.ini --follow-imports=skip services/decision_kernel services/type_system.py services/type_ddl_specialty.py

      - name: Assert optional RAG deps are not in default install
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("chromadb", "sentence_transformers"):
              if importlib.util.find_spec(name) is not None:
                  raise SystemExit(f"{name} must not be installed from default requirements.txt")
          print("ok: chromadb/sentence_transformers absent from default env")
          PY

      - name: pip-audit installed default API environment
        # Optional RAG extras (chromadb / sentence-transformers) live in
        # requirements-rag.txt and are intentionally out of this gate.
        # Databricks SQL is in requirements-databricks.txt for the same reason:
        # the connector still requires oauthlib<4. No vulnerabilities are ignored.
        run: |
          pip-audit --local

      - name: Licence gate (F3) — no unreviewed copyleft / unknown licence, NOTICE complete
        # Scans the installed runtime + dev Python closure (importlib.metadata)
        # and package-lock.json. A new GPL/AGPL/LGPL/SSPL/MPL or unknown licence
        # fails until it is reviewed in licence-policy.json; a direct production
        # dependency missing from NOTICE fails until NOTICE is regenerated.
        run: |
          python scripts/licence_scan.py --check --check-notice NOTICE --markdown "$RUNNER_TEMP/licence-report.md" --json "$RUNNER_TEMP/licence-report.json"
          cat "$RUNNER_TEMP/licence-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: LGPL source shipping step cannot drift (owner decision 2)
        # Dockerfile.api ships the corresponding source of the approved LGPL
        # packages. Fails when its package list differs from the approved
        # entries in licence-policy.json, when one is not a runtime
        # requirement, when an installed version has no sdist on PyPI, when
        # pymssql no longer shows the FreeTDS version it links, or when an
        # installed wheel bundles a native library (<pkg>.libs/) that
        # scripts/bundled_libraries.py has not reviewed or whose (L)GPL
        # source it cannot name.
        run: python scripts/fetch_lgpl_sources.py --verify-dockerfile Dockerfile.api

      - name: Debian package drift check (Dockerfile.api final stage)
        # Fails when the final stage installs an apt package that
        # licence-policy.json apt_packages has not reviewed (or no longer
        # installs a listed one), or a compiler / -dev package. The image
        # build itself ships the source of every copyleft package; the
        # api-image job proves it.
        run: python scripts/fetch_debian_sources.py --verify-dockerfile Dockerfile.api

      - name: Companion source bundle drift check (Dockerfile.api stages)
        # The companion stage lists exactly UPSTREAM's companion-located
        # families (the GCC source) and runs the Debian step, which ships every
        # copyleft package; the runtime stages run neither, and carry the
        # pointer, the label and the build-time exactness check.
        run: python scripts/source_bundle.py --verify-dockerfile Dockerfile.api

      - name: Upload licence report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: |
            ${{ runner.temp }}/licence-report.md
            ${{ runner.temp }}/licence-report.json
          if-no-files-found: warn

      - name: bandit high-severity gate (production code)
        # Fail on High only — Medium SQL f-string debt is tracked separately;
        # key identifier paths are hardened via connectors/sql_identifiers.py.
        # Posture + false-positive catalogue: docs/SECURITY_SCANNING.md
        run: >
          bandit -c bandit.yaml
          -r apps/api/connectors apps/api/services apps/api/src
          -lll
          -q

  api-image:
    needs: changes
    if: ${{ needs.changes.outputs.reuse != 'true' }}
    # Builds Dockerfile.api's three targets without a layer cache (so the
    # source steps really run):
    # - the deployable default target (what Railway builds), first and on its
    #   own: it must not run any companion stage;
    # - the companion source bundle (--target sources, what release.yml
    #   publishes as <image>:<tag>-sources);
    # - the release image (--target release): the runtime plus the pointer.
    # Runtime checks: no compiler or build-essential; the small wheel sources
    # and inventory present; no Debian or GCC source and no pointer; pip check;
    # imports. Release checks: the SOURCES.md pointer, the label and the
    # companion's SHA256SUMS. Companion checks: every file matches its
    # SHA256SUMS, which equals the release image's copy. keyutils 1.5.8 has only a published MD5: this job
    # records its SHA-256 once (after the MD5 check) and fails if it changes.
    name: API image (runtime + companion source bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the deployable default target (no companion stages)
        # What Railway builds for api, worker and scheduler. It must not run
        # sources-collect: a deploy never downloads the Debian / GCC sources.
        shell: bash
        run: |
          docker buildx build --load --progress=plain -f Dockerfile.api -t datawrap-api:ci . 2>&1 \
            | tee "$RUNNER_TEMP/runtime-build.log"
          if grep -qE "\[sources-collect|fetch_debian_sources\.py --dest|fetch_lgpl_sources\.py --companion" \
              "$RUNNER_TEMP/runtime-build.log"; then
            echo "the default target ran a companion stage (sources-collect)"; exit 1
          fi

      - name: Build the companion source bundle (target sources)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: sources
          load: true
          push: false
          tags: datawrap-api:ci-sources

      - name: Build the release image (target release, with the pointer)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: release
          load: true
          push: false
          tags: datawrap-api:ci-release
          build-args: SOURCES_REF=datawrap-api:ci-sources

      - name: Check the runtime image
        run: |
          docker image ls datawrap-api:ci --format 'runtime image size: {{.Size}}'
          cat > "$RUNNER_TEMP/check-runtime.sh" <<'CHECK'
          set -e
          if dpkg -s build-essential >/dev/null 2>&1; then echo "build-essential is in the image"; exit 1; fi
          if command -v gcc >/dev/null 2>&1; then echo "gcc is in the image"; exit 1; fi
          src=/usr/share/doc/datawrap/third-party-source
          cd "$src"
          for f in SHA256SUMS MANIFEST.json BUNDLED_LIBRARIES.json; do test -s "$f" || { echo "missing $src/$f"; exit 1; }; done
          sha256sum --check --quiet SHA256SUMS
          ls freetds-*.tar.bz2 paramiko-*.tar.gz psycopg2-*.tar.gz pymssql-*.tar.gz keyutils-*.tar.bz2 libxcrypt-*.tar.xz
          if ls *.dsc gcc-* 2>/dev/null | grep -q .; then echo "Debian or GCC source is in the runtime image"; exit 1; fi
          test ! -e DEBIAN_SOURCES.json || { echo "DEBIAN_SOURCES.json is in the runtime image"; exit 1; }
          test ! -e /tmp/lgpl || { echo "the source-step scripts are in the runtime image"; exit 1; }
          du -sh "$src"
          pip check
          python -c 'import fastapi, psycopg2, pymssql, pyodbc, snowflake.connector, preflight'
          CHECK
          docker run --rm -v "$RUNNER_TEMP/check-runtime.sh:/check-runtime.sh:ro" datawrap-api:ci sh /check-runtime.sh

      - name: Check the release image (pointer to the companion)
        run: |
          docker image ls datawrap-api:ci-release --format 'release image size: {{.Size}}'
          label=$(docker inspect -f '{{ index .Config.Labels "io.datawrap.sources" }}' datawrap-api:ci-release)
          [ "$label" = "datawrap-api:ci-sources" ] || { echo "the source label is '$label'"; exit 1; }
          docker run --rm datawrap-api:ci-release sh -ec '
            grep -q "datawrap-api:ci-sources" /usr/share/doc/datawrap/SOURCES.md
            grep -q "Debian source packages" /usr/share/doc/datawrap/SOURCES.md
            test -s /usr/share/doc/datawrap/companion/SHA256SUMS'
          if docker run --rm datawrap-api:ci test -e /usr/share/doc/datawrap/SOURCES.md; then
            echo "the deployable runtime carries the release pointer"; exit 1
          fi

      - name: Check the companion source bundle
        run: |
          docker image ls datawrap-api:ci-sources --format 'companion image size: {{.Size}}'
          cid=$(docker create datawrap-api:ci-sources none)
          mkdir -p "$RUNNER_TEMP/companion"
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/companion"
          docker rm "$cid" >/dev/null
          cd "$RUNNER_TEMP/companion"
          sha256sum --check --quiet SHA256SUMS
          ls *.dsc gcc-*.tar.xz DEBIAN_SOURCES.json MANIFEST.json
          docker run --rm datawrap-api:ci-release cat /usr/share/doc/datawrap/companion/SHA256SUMS | diff - SHA256SUMS
          python3 -c 'import json; d = json.load(open("DEBIAN_SOURCES.json")); print(len(d["sources"]), "Debian source packages in the companion")'
          du -sh .

      - name: Restore the recorded keyutils 1.5.8 SHA-256
        uses: actions/cache@v4
        with:
          path: .ci-pins/keyutils-1.5.8.sha256
          key: keyutils-1.5.8-sha256-v1

      - name: keyutils 1.5.8 - MD5 verified, SHA-256 recorded and held
        # Only an MD5 was ever published for keyutils-1.5.8.tar.bz2 (Arch
        # Linux's 1.5.8-1 PKGBUILD). The image build verified it; this step
        # re-checks it, records the tarball's SHA-256 on the first run, and
        # fails if a later download differs. Commit the recorded value as
        # UPSTREAM sha256 in scripts/bundled_libraries.py to make the build
        # itself enforce it.
        run: |
          out=$(docker run --rm datawrap-api:ci sh -c 'cd /usr/share/doc/datawrap/third-party-source && md5sum keyutils-1.5.8.tar.bz2 && sha256sum keyutils-1.5.8.tar.bz2')
          md5=$(echo "$out" | awk 'NR==1 {print $1}')
          sha256=$(echo "$out" | awk 'NR==2 {print $1}')
          [ "$md5" = "3c7f463039b83833c12a9414c2fcb389" ] || { echo "::error::keyutils-1.5.8.tar.bz2 MD5 is $md5"; exit 1; }
          pin=.ci-pins/keyutils-1.5.8.sha256
          if [ -f "$pin" ]; then
            if [ "$(cat "$pin")" != "$sha256" ]; then
              echo "::error::keyutils-1.5.8.tar.bz2 sha256 changed: recorded $(cat "$pin"), now $sha256"
              exit 1
            fi
            echo "keyutils-1.5.8.tar.bz2 sha256 $sha256 matches the recorded value"
          else
            mkdir -p .ci-pins && echo "$sha256" > "$pin"
            echo "::notice::recorded keyutils-1.5.8.tar.bz2 sha256 $sha256 (MD5 verified); commit it as UPSTREAM sha256"
          fi

  # Wizard project plus the production pageerror smoke. Flag-off Transfer
  # Studio stays on the dev server; prod-smoke loads `vite preview` of the
  # production build. Job ids stay studio-ui and studio-ui-next so the
  # required check name does not change. Shared setup lives in
  # .github/actions/studio-surface. studio-ui-next is not a required check.
  studio-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The a11y project (UX-16) is the axe-core WCAG 2.2 A/AA gate over the
      # main screens: any critical or serious violation fails this job. The
      # phone project (UX-5) taps every Destination card at 390 px.
      - name: Wizard, accessibility gate and production smoke
        uses: ./.github/actions/studio-surface
        with:
          playwright_project: wizard
          extra_playwright_projects: a11y phone
          production_smoke: "true"
          artifact_name: studio-ui-wizard

  studio-ui-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flagged schema browser and canvas
        uses: ./.github/actions/studio-surface
        with:
          playwright_project: studio-next
          production_smoke: "false"
          artifact_name: studio-ui-next

  # Plan-conflict flow (PR 422): a save, Approve or Execute that meets a
  # newer plan revision opens the comparison instead of overwriting it.
  # Hermetic stubs, dev server only.
  plan-conflict-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan conflict comparison
        uses: ./.github/actions/studio-surface
        with:
          playwright_project: plan-conflict
          production_smoke: "false"
          artifact_name: plan-conflict-e2e

  required-checks:
    name: Required PR gate
    if: ${{ always() && !cancelled() }}
    needs:
      - changes
      - mapping-evidence
      - ai-offline-correctness
      - pilot-answer-quality
      - no-config-transfer
      - gitops
      - api-tests
      - api-and-web
      - cdc-sqlserver
      - cdc-oracle
      - security
      - api-image
      - studio-ui
      - plan-conflict-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory check to pass
        env:
          MAPPING_EVIDENCE: ${{ needs.mapping-evidence.result }}
          AI_OFFLINE: ${{ needs.ai-offline-correctness.result }}
          PILOT_QUALITY: ${{ needs.pilot-answer-quality.result }}
          NO_CONFIG_TRANSFER: ${{ needs.no-config-transfer.result }}
          GITOPS: ${{ needs.gitops.result }}
          API_TESTS: ${{ needs.api-tests.result }}
          API_AND_WEB: ${{ needs.api-and-web.result }}
          CDC_SQLSERVER: ${{ needs.cdc-sqlserver.result }}
          CDC_ORACLE: ${{ needs.cdc-oracle.result }}
          ENABLE_ORACLE_CDC: ${{ vars.ENABLE_ORACLE_CDC }}
          SECURITY: ${{ needs.security.result }}
          API_IMAGE: ${{ needs.api-image.result }}
          STUDIO_UI: ${{ needs.studio-ui.result }}
          PLAN_CONFLICT_E2E: ${{ needs.plan-conflict-e2e.result }}
          CHANGES: ${{ needs.changes.result }}
          REUSE: ${{ needs.changes.outputs.reuse }}
          REUSED_FROM: ${{ needs.changes.outputs.from }}
          REUSABLE: " mapping-evidence ai-offline-correctness pilot-answer-quality no-config-transfer gitops api-tests cdc-sqlserver security api-image "
        run: |
          failed=0
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES"
            failed=1
          fi
          [ "$REUSE" = "true" ] && echo "Backend checks reused from $REUSED_FROM (web-only change)."
          for check in \
            "mapping-evidence:$MAPPING_EVIDENCE" \
            "ai-offline-correctness:$AI_OFFLINE" \
            "pilot-answer-quality:$PILOT_QUALITY" \
            "no-config-transfer:$NO_CONFIG_TRANSFER" \
            "gitops:$GITOPS" \
            "api-tests:$API_TESTS" \
            "api-and-web:$API_AND_WEB" \
            "cdc-sqlserver:$CDC_SQLSERVER" \
            "cdc-oracle:$CDC_ORACLE" \
            "security:$SECURITY" \
            "api-image:$API_IMAGE" \
            "studio-ui:$STUDIO_UI" \
            "plan-conflict-e2e:$PLAN_CONFLICT_E2E"; do
            name="${check%%:*}"
            result="${check##*:}"
            echo "$name: $result"
            if [ "$name" = "cdc-oracle" ] && [ "$result" = "skipped" ] && [ "$ENABLE_ORACLE_CDC" != "true" ]; then
              # Opt-in and off: skipped (grey), recorded not_run, never green.
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$REUSE" = "true" ] && [[ "$REUSABLE" == *" $name "* ]]; then
              continue
            fi
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
