name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lean evidence pack — no databases. Regenerates claim→metric catalog and
  # fails when marketing floors exceed measured fixture proofs.
  mapping-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API + preflight
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          python -m pip install -e packages/preflight

      - name: Build evidence catalog
        env:
          PYTHONPATH: apps/api:packages/preflight/src
        run: |
          python apps/api/scripts/run_evidence_pack.py --refresh-pairs --fail-on-miss
          echo "### Mapping evidence pack" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          cat = json.loads(Path("apps/api/data/proofs/evidence_catalog.json").read_text())
          print(f"- **{'PASS' if cat['all_passed'] else 'FAIL'}** — {cat['passed_count']}/{cat['claim_count']} claims")
          for c in cat["claims"]:
              mark = "ok" if c["passed"] else "MISS"
              print(f"- `{c['id']}`: {mark}")
          print()
          print("Artifact: `apps/api/data/proofs/EVIDENCE_CATALOG.md`")
          PY

      - name: Evidence pack pytest gate
        working-directory: apps/api
        env:
          PYTHONPATH: .:../../packages/preflight/src
        run: |
          python -m pytest tests/test_evidence_pack.py -q --tb=short

      - name: God-module size budgets (Phase F8)
        working-directory: apps/api
        run: |
          python scripts/check_module_size_budgets.py
          python scripts/connector_capability_matrix_report.py

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-evidence-catalog
          path: |
            apps/api/data/proofs/evidence_catalog.json
            apps/api/data/proofs/EVIDENCE_CATALOG.md
            apps/api/data/proofs/abbreviation_coverage.json
            apps/api/data/proofs/mapping_connector_pair_matrix/
            apps/api/data/proofs/module_size_budgets.json
            apps/api/data/proofs/connector_capability_matrix.json

  # AI ITEM 1 — full Map/LLM suite with no network and no API keys.
  # Proves offline claim: LLM cannot change mapping decisions / checksums.
  ai-offline-correctness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Offline LLM-off correctness (ITEM 1)
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          # Empty keys + unreachable Ollama — no network LLM. Policy-off is
          # asserted inside test_offline_env_forces_llm_policy_off; mock tests
          # patch is_llm_enabled when they need the suggest path.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OLLAMA_HOST: "http://127.0.0.1:9"
        run: |
          python -m pytest \
            tests/test_item1_llm_never_correctness_path.py \
            tests/test_llm_mapping.py \
            -q --tb=short

  # Property 2 — no-config transfer must never be blocked by additive/DDL gates.
  # Services make the full golden matrix (PG/MySQL/Mongo) runnable with zero skips.
  no-config-transfer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
          POSTGRES_DB: dataflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dataflow -d dataflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pdataflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mongo:
        image: public.ecr.aws/docker/library/mongo:7
        ports:
          - 27017:27017
        # Without a healthcheck the step can start before mongod accepts
        # connections; the Mongo routes then skip, and the no-skip guard fails
        # the job for an image that was configured correctly.
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Golden-path no-config transfer (Property 2)
        working-directory: apps/api
        env:
          PYTHONPATH: .
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          P2_PG_HOST: 127.0.0.1
          P2_PG_PORT: "5432"
          P2_PG_DB: dataflow
          P2_PG_USER: dataflow
          P2_PG_PASSWORD: dataflow
          P2_MYSQL_HOST: 127.0.0.1
          P2_MYSQL_PORT: "3306"
          P2_MYSQL_DB: dataflow
          P2_MYSQL_USER: dataflow
          P2_MYSQL_PASSWORD: dataflow
          P2_MONGO_URI: mongodb://127.0.0.1:27017
        run: |
          # Fail the job if any golden-path test is skipped (services must be up).
          out="$(mktemp)"
          set +e
          python -m pytest tests/test_property2_golden_path_never_blocked.py -q --tb=short | tee "$out"
          rc=${PIPESTATUS[0]}
          set -e
          if grep -Eq '[1-9][0-9]* skipped' "$out"; then
            echo "Property 2 golden path must not skip when CI services are present" >&2
            cat "$out" >&2
            exit 1
          fi
          exit "$rc"

  # Fast GitOps gate — no databases. Validates example manifest + CLI plan/apply proofs.
  gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps (CLI --local imports services.*)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Validate example dataflow.yaml
        run: |
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli validate -f examples/gitops/dataflow.yaml
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli validate -f examples/gitops/dataflow.staging.yaml

      - name: Plan example manifest (local stores)
        env:
          DATAFLOW_DATA_DIR: ${{ runner.temp }}/dataflow-gitops
          DATAFLOW_JOB_STORE: memory
        run: |
          mkdir -p "$DATAFLOW_DATA_DIR"
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli plan -f examples/gitops/dataflow.yaml --local
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli plan -f examples/gitops/dataflow.staging.yaml --local

      - name: GitOps unit proofs
        env:
          DATAFLOW_DATA_DIR: ${{ runner.temp }}/dataflow-gitops-tests
          DATAFLOW_JOB_STORE: memory
        run: |
          mkdir -p "$DATAFLOW_DATA_DIR"
          cd apps/api
          python -m pytest tests/test_gitops_plan_apply.py tests/test_dataflow_cli.py tests/test_enterprise_p0_p2.py::test_gitops_manifest_shape -q --tb=short

  # Optional CD apply to a staging API — only when repo variable is set.
  # Apply itself requires DATAFLOW_STAGING_APPLY=1 (variable) on main.
  gitops-cd-staging:
    runs-on: ubuntu-latest
    needs: [gitops]
    if: ${{ vars.DATAFLOW_STAGING_API_BASE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Plan against staging API
        env:
          DATAFLOW_API_BASE: ${{ vars.DATAFLOW_STAGING_API_BASE }}
          DATAFLOW_API_TOKEN: ${{ secrets.DATAFLOW_STAGING_API_TOKEN }}
        run: |
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli validate -f examples/gitops/dataflow.staging.yaml
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli plan -f examples/gitops/dataflow.staging.yaml --api "$DATAFLOW_API_BASE" --token "$DATAFLOW_API_TOKEN"

      - name: Apply with signed-contract gate
        if: ${{ github.ref == 'refs/heads/main' && vars.DATAFLOW_STAGING_APPLY == '1' }}
        env:
          DATAFLOW_API_BASE: ${{ vars.DATAFLOW_STAGING_API_BASE }}
          DATAFLOW_API_TOKEN: ${{ secrets.DATAFLOW_STAGING_API_TOKEN }}
        run: |
          PYTHONPATH=apps/api:apps/cli python -m dataflow_cli apply \
            -f examples/gitops/dataflow.staging.yaml \
            --api "$DATAFLOW_API_BASE" \
            --token "$DATAFLOW_API_TOKEN" \
            --yes \
            --require-signed-contracts

  api-and-web:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: public.ecr.aws/docker/library/mongo:7
        ports:
          - 27017:27017
        # Without a healthcheck the step can start before mongod accepts
        # connections; the Mongo routes then skip, and the no-skip guard fails
        # the job for an image that was configured correctly.
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # MySQL 8 enables ROW-based binlog by default, so MySQL matrix + binlog
      # CDC tests run here instead of silently skipping.
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pdataflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Postgres is started in a step (not as a service) so we can enable
      # wal_level=logical for CDC integration tests. See Dockerfile.postgres-cdc.
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres with logical CDC
        run: |
          docker build -t dataflow-postgres-cdc:ci -f apps/api/docker/Dockerfile.postgres-cdc apps/api/docker
          docker run -d --name dataflow-postgres-cdc \
            -e POSTGRES_USER=dataflow \
            -e POSTGRES_PASSWORD=dataflow \
            -e POSTGRES_DB=dataflow \
            -p 5432:5432 \
            dataflow-postgres-cdc:ci
          for i in $(seq 1 30); do
            if docker exec dataflow-postgres-cdc pg_isready -U dataflow; then
              wal=$(docker exec dataflow-postgres-cdc psql -U dataflow -d dataflow -Atc "SHOW wal_level")
              echo "wal_level=${wal}"
              test "${wal}" = "logical"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres CDC container failed to become ready" >&2
          docker logs dataflow-postgres-cdc || true
          exit 1

      - name: Start BigQuery emulator
        # goccy/bigquery-emulator gives us an always-on BigQuery API surface in CI
        # so the warehouse SKU matrix (file→BigQuery, PG→BigQuery) is proven without
        # production credentials. Snowflake is exercised through fakesnow.
        run: |
          docker run -d --name dataflow-bigquery-emulator \
            -p 9050:9050 -p 9060:9060 \
            ghcr.io/goccy/bigquery-emulator:latest \
            --project=dataflow-test --dataset=dataflow --log-level=error
          for i in $(seq 1 30); do
            # The emulator does not serve /; use the BigQuery discovery API.
            if curl -fsS http://127.0.0.1:9050/discovery/v1/apis/bigquery/v2/rest >/dev/null 2>&1; then
              echo "BigQuery emulator ready"
              exit 0
            fi
            sleep 2
          done
          echo "BigQuery emulator failed to start" >&2
          docker logs dataflow-bigquery-emulator || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          cd ../../packages/preflight
          python -m pip install -e .

      - name: Install Node dependencies
        run: npm ci

      - name: Grant MySQL CDC privileges
        run: |
          python - <<'PY'
          import sys, time
          try:
              import pymysql
          except ImportError:
              print("pymysql not installed; skipping MySQL CDC grant", file=sys.stderr)
              sys.exit(0)
          conn = None
          for _ in range(60):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      password="dataflow",
                      database="dataflow",
                  )
                  break
              except Exception:
                  time.sleep(1)
          if conn is None:
              print("MySQL not reachable; skipping CDC privilege grant", file=sys.stderr)
              sys.exit(0)
          with conn.cursor() as cur:
              cur.execute("GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'dataflow'@'%'")
              cur.execute("GRANT ALL PRIVILEGES ON dataflow.* TO 'dataflow'@'%'")
              cur.execute("FLUSH PRIVILEGES")
          conn.close()
          PY

      - name: Run tests
        id: api_tests
        run: npm run test
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"
          DATAFLOW_FAKESNOW_KEEP_PATCH: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: dataflow
          PGPASSWORD: dataflow
          PGDATABASE: dataflow

      # Phase B9 — proof steps MUST run even when Run tests fails (audit §3.2).
      # Never silently omit CDC / warehouse evidence from the CI record.
      - name: CDC matrix report
        id: cdc_matrix
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run test:cdc
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: dataflow
          PGPASSWORD: dataflow
          PGDATABASE: dataflow
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow
          DATAFLOW_CDC_LEASE_BACKEND: redis
          DATAFLOW_CDC_LEASE_REDIS_URL: redis://127.0.0.1:6379/15

      - name: Warehouse SKU proof report
        id: warehouse_sku
        if: ${{ !cancelled() && (success() || failure()) }}
        # Always-on Snowflake (fakesnow) + BigQuery (goccy emulator) proof.
        # SaaS reverse-ETL destinations (Salesforce/HubSpot) skip without creds.
        working-directory: apps/api
        run: |
          set +e
          python scripts/warehouse_sku_report.py
          code=$?
          echo "### Warehouse SKU proof" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/proofs/warehouse_sku_report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/proofs/warehouse_sku_report.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- **{'PASS' if d.get('exit_code') == 0 else 'FAIL'}** — {d.get('passed', 0)} passed, {d.get('failed', 0)} failed, {d.get('skipped', 0)} skipped")
          for reason in d.get("skip_reasons") or []:
              print(f"- skip: {reason}")
          print("- Artifact: `apps/api/data/proofs/warehouse_sku_report.json`")
          PY
          else
            echo "- **NO ARTIFACT** — warehouse_sku_report.py did not write proof JSON" >> "$GITHUB_STEP_SUMMARY"
            code=1
          fi
          exit $code
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"
          DATAFLOW_FAKESNOW_KEEP_PATCH: "1"

      - name: TRANSFER_READY certification matrix
        id: transfer_ready_matrix
        if: ${{ !cancelled() && (success() || failure()) }}
        # Phase E2 — publish PRODUCTION_SKU × unique_drivers honesty artifact.
        working-directory: apps/api
        run: |
          python scripts/transfer_ready_matrix_report.py
          echo "### TRANSFER_READY matrix" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/proofs/transfer_ready_matrix.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- unique_drivers: {d.get('unique_driver_count')}")
          print(f"- PRODUCTION_SKU routes: {d.get('production_sku_route_count')}")
          print("- Artifact: `apps/api/data/proofs/transfer_ready_matrix.json`")
          PY

      - name: Upload migration proof artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-proof-ci
          if-no-files-found: warn
          path: |
            apps/api/data/proofs/cdc_matrix_report.json
            apps/api/data/proofs/warehouse_sku_report.json
            apps/api/data/proofs/transfer_ready_matrix.json

      - name: Frontend unit contracts
        id: frontend_tests
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run test:web

      - name: Build web
        id: web_build
        if: ${{ !cancelled() && (success() || failure()) }}
        run: npm run build

      - name: Frontend chunk budgets (Phase F9)
        id: chunk_budgets
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' }}
        working-directory: apps/web
        run: node scripts/check_chunk_budgets.mjs

      # Surface which gate failed when earlier steps failed but proofs still ran.
      - name: Fail job if api tests or proof gates failed
        if: ${{ always() && !cancelled() }}
        run: |
          api="${{ steps.api_tests.outcome }}"
          cdc="${{ steps.cdc_matrix.outcome }}"
          wh="${{ steps.warehouse_sku.outcome }}"
          trm="${{ steps.transfer_ready_matrix.outcome }}"
          fe="${{ steps.frontend_tests.outcome }}"
          web="${{ steps.web_build.outcome }}"
          # A budget that cannot fail the job is not a budget: chunk_budgets ran
          # but its outcome was never read, so an oversized bundle merged green.
          chunks="${{ steps.chunk_budgets.outcome }}"
          echo "api_tests=$api cdc_matrix=$cdc warehouse_sku=$wh transfer_ready_matrix=$trm frontend=$fe web_build=$web chunk_budgets=$chunks"
          fail=0
          for name_out in "api_tests:$api" "cdc_matrix:$cdc" "warehouse_sku:$wh" "transfer_ready_matrix:$trm" "frontend_tests:$fe" "web_build:$web" "chunk_budgets:$chunks"; do
            name="${name_out%%:*}"
            out="${name_out##*:}"
            # skipped only acceptable when job cancelled mid-flight; otherwise require success
            if [ "$out" != "success" ]; then
              fail=1
            fi
          done
          echo "### Merge gate (B9)" >> "$GITHUB_STEP_SUMMARY"
          echo "- api_tests: \`$api\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cdc_matrix: \`$cdc\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- warehouse_sku: \`$wh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- transfer_ready_matrix: \`$trm\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_tests: \`$fe\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- web_build: \`$web\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- chunk_budgets: \`$chunks\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "Red CI blocks merge — fix failing gates before claiming production readiness." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- All required gates green (api + CDC + warehouse SKU + TRANSFER_READY matrix + frontend + web build + chunk budgets)." >> "$GITHUB_STEP_SUMMARY"

  # Separate job: SQL Server image is large/slow; keep main CI lean.
  cdc-sqlserver:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dataflow
          MYSQL_DATABASE: dataflow
          MYSQL_USER: dataflow
          MYSQL_PASSWORD: dataflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pdataflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres with logical CDC
        run: |
          docker build -t dataflow-postgres-cdc:ci -f apps/api/docker/Dockerfile.postgres-cdc apps/api/docker
          docker run -d --name dataflow-postgres-cdc \
            -e POSTGRES_USER=dataflow \
            -e POSTGRES_PASSWORD=dataflow \
            -e POSTGRES_DB=dataflow \
            -p 5432:5432 \
            dataflow-postgres-cdc:ci
          for i in $(seq 1 30); do
            if docker exec dataflow-postgres-cdc pg_isready -U dataflow; then
              wal=$(docker exec dataflow-postgres-cdc psql -U dataflow -d dataflow -Atc "SHOW wal_level")
              echo "wal_level=${wal}"
              test "${wal}" = "logical"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres CDC container failed to become ready" >&2
          docker logs dataflow-postgres-cdc || true
          exit 1

      - name: Start SQL Server
        run: |
          docker run -d --name dataflow-sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='DataFlow_CDC_2022!' \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec dataflow-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'DataFlow_CDC_2022!' -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server ready"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server failed to become ready" >&2
          docker logs dataflow-sqlserver || true
          exit 1

      - name: Install Microsoft ODBC Driver 18
        run: |
          # --batch/--yes: runners have no TTY; gpg otherwise prompts to overwrite and fails.
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Init Change Tracking + native CDC
        run: |
          docker cp apps/api/tests/sqlserver_ct_init.sql dataflow-sqlserver:/tmp/ct_init.sql
          docker cp apps/api/tests/sqlserver_cdc_init.sql dataflow-sqlserver:/tmp/cdc_init.sql
          docker exec dataflow-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'DataFlow_CDC_2022!' -C -i /tmp/ct_init.sql
          docker exec dataflow-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'DataFlow_CDC_2022!' -C -i /tmp/cdc_init.sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Grant MySQL CDC privileges
        run: |
          python - <<'PY'
          import sys, time
          import pymysql
          conn = None
          for _ in range(60):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      password="dataflow",
                      database="dataflow",
                  )
                  break
              except Exception:
                  time.sleep(1)
          if conn is None:
              print("MySQL not reachable; skipping CDC privilege grant", file=sys.stderr)
              sys.exit(0)
          with conn.cursor() as cur:
              cur.execute("GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'dataflow'@'%'")
              cur.execute("GRANT ALL PRIVILEGES ON dataflow.* TO 'dataflow'@'%'")
              cur.execute("FLUSH PRIVILEGES")
          conn.close()
          PY

      - name: Run SQL Server CDC tests
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_cdc_sqlserver_ct_integration.py \
            tests/test_cdc_sqlserver_native_integration.py \
            tests/test_sqlserver_native_cdc.py \
            tests/test_sqlserver_oracle_cdc.py \
            -v --tb=short
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_CDC_LEASE_BACKEND: memory

      - name: SQL Server warehouse SKU proof report
        # Prove the production SQL Server routes (PG↔SQL Server, MySQL↔SQL Server)
        # against the real mssql/server container without cloud credentials.
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_production_sku_matrix.py \
            -k "sqlserver" \
            -q --tb=short --durations=0 \
            | tee sqlserver_sku_report.txt
          passed=$(grep -oP '^\d+(?= passed)' sqlserver_sku_report.txt | head -1 || echo "0")
          skipped=$(grep -oP '^\d+(?= skipped)' sqlserver_sku_report.txt | head -1 || echo "0")
          echo "### SQL Server warehouse SKU proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${passed:-0} passed, ${skipped:-0} skipped (SQL Server via mssql/server container; PG/MySQL peers via service containers)" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"

      - name: SQL Server warehouse SKU proof report
        # SQL Server is a first-class production destination; prove file→SQL Server
        # and database→SQL Server routes with the local mssql/server container.
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_production_sku_matrix.py \
            tests/test_execute_tracked_universal_matrix.py \
            -k "sqlserver" \
            -q --tb=short --durations=0 \
            | tee sqlserver_sku_report.txt
          passed=$(grep -oP '^\d+(?= passed)' sqlserver_sku_report.txt | head -1 || echo "0")
          skipped=$(grep -oP '^\d+(?= skipped)' sqlserver_sku_report.txt | head -1 || echo "0")
          echo "### SQL Server warehouse SKU proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${passed:-0} passed, ${skipped:-0} skipped (SQL Server via mssql/server container)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Oracle routes remain credential-gated and skipped when no secret is present" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_PII_HASH_KEY: test-pii-key
          DATAFLOW_ALLOW_STUB_WRITES: "1"

  # Optional: enable via repo variable ENABLE_ORACLE_CDC=true.
  # Secrets must NOT appear in job `if:` (GitHub rejects `secrets` there).
  # Missing credentials → pytest skip via DATAFLOW_ORACLE_* gates.
  cdc-oracle:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_ORACLE_CDC == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Oracle password secret
        id: oracle_creds
        env:
          DATAFLOW_ORACLE_PASSWORD: ${{ secrets.DATAFLOW_ORACLE_PASSWORD }}
        run: |
          if [ -z "${DATAFLOW_ORACLE_PASSWORD}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATAFLOW_ORACLE_PASSWORD secret not set — skipping Oracle CDC live IT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.oracle_creds.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps + Oracle client
        if: steps.oracle_creds.outputs.skip != 'true'
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install oracledb

      - name: Run Oracle CDC live IT
        if: steps.oracle_creds.outputs.skip != 'true'
        working-directory: apps/api
        run: |
          python -m pytest \
            tests/test_cdc_oracle_integration.py \
            tests/test_sqlserver_oracle_cdc.py \
            -v --tb=short
        env:
          DATAFLOW_JOB_STORE: memory
          DATAFLOW_DISABLE_OBJECT_STORE: "1"
          DATAFLOW_ORACLE_ENABLE: "1"
          DATAFLOW_ORACLE_HOST: ${{ secrets.DATAFLOW_ORACLE_HOST }}
          DATAFLOW_ORACLE_PORT: ${{ secrets.DATAFLOW_ORACLE_PORT }}
          DATAFLOW_ORACLE_SERVICE: ${{ secrets.DATAFLOW_ORACLE_SERVICE }}
          DATAFLOW_ORACLE_USER: ${{ secrets.DATAFLOW_ORACLE_USER }}
          DATAFLOW_ORACLE_PASSWORD: ${{ secrets.DATAFLOW_ORACLE_PASSWORD }}
          DATAFLOW_ORACLE_SCHEMA: ${{ secrets.DATAFLOW_ORACLE_SCHEMA }}

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools and default API deps
        run: |
          python -m pip install --upgrade pip pip-audit bandit ruff mypy
          python -m pip install -r apps/api/requirements.txt

      - name: Ruff baseline (Phase B8 allowlist)
        # Start narrow — BLE001/S110/DTZ001/F401 on Decision Kernel + Phase A/B paths.
        # Expand allowlist as modules are cleaned; full tree is not yet green.
        working-directory: apps/api
        run: >
          ruff check
          --config ruff.toml
          services/decision_kernel
          services/auth_rate_limit.py
          services/auto_create_lifecycle.py
          services/staging_reaper.py
          services/control_totals.py
          src/services/auth_service.py
          connectors/elasticsearch_writer.py
          connectors/sqlite_writer.py

      - name: Mypy Decision Kernel (Phase B8)
        # Strict on services.decision_kernel; type_system follows as a skip-import smoke.
        working-directory: apps/api
        run: |
          # One invocation: with --follow-imports=skip, anything not named here
          # resolves to Any, so checking type_system apart from the modules it
          # delegates to left every invent path unchecked in both directions.
          python -m mypy --config-file mypy.ini --follow-imports=skip services/decision_kernel services/type_system.py services/type_ddl_specialty.py

      - name: Assert optional RAG deps are not in default install
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("chromadb", "sentence_transformers"):
              if importlib.util.find_spec(name) is not None:
                  raise SystemExit(f"{name} must not be installed from default requirements.txt")
          print("ok: chromadb/sentence_transformers absent from default env")
          PY

      - name: pip-audit installed default API environment
        # Optional RAG extras (chromadb / sentence-transformers) live in
        # requirements-rag.txt and are intentionally out of this gate.
        run: pip-audit --local

      - name: bandit high-severity gate (production code)
        # Fail on High only — Medium SQL f-string debt is tracked separately;
        # key identifier paths are hardened via connectors/sql_identifiers.py.
        # Posture + false-positive catalogue: docs/SECURITY_SCANNING.md
        run: >
          bandit -c bandit.yaml
          -r apps/api/connectors apps/api/services apps/api/src
          -lll
          -q
