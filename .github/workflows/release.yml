name: Release Workflow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-pr:
    name: PR quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      DATAFLOW_ORACLE_HOST: ${{ secrets.DATAFLOW_ORACLE_HOST }}
      DATAFLOW_ORACLE_PORT: ${{ secrets.DATAFLOW_ORACLE_PORT }}
      DATAFLOW_ORACLE_SERVICE: ${{ secrets.DATAFLOW_ORACLE_SERVICE }}
      DATAFLOW_ORACLE_USER: ${{ secrets.DATAFLOW_ORACLE_USER }}
      DATAFLOW_ORACLE_PASSWORD: ${{ secrets.DATAFLOW_ORACLE_PASSWORD }}
      DATAFLOW_ORACLE_SCHEMA: ${{ secrets.DATAFLOW_ORACLE_SCHEMA }}

  verify-snapshot:
    name: Full snapshot verification
    uses: ./.github/workflows/full-suite.yml
    permissions:
      contents: read
    secrets:
      DATAFLOW_STAGING_API_TOKEN: ${{ secrets.DATAFLOW_STAGING_API_TOKEN }}

  publish-images:
    name: Build and publish ${{ matrix.image }}
    needs: [verify-pr, verify-snapshot]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
            # The API image's large copyleft sources (Debian packages, GCC) are
            # in a companion image, <name>:<tag>-sources, published first.
            companion: true
          - image: web
            dockerfile: Dockerfile.web
            companion: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must follow vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release commit must be reachable from origin/main" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push the companion source image (tag + -sources)
        # Owner decision 2026-11-13: the Debian system-package sources and the
        # GCC source are not in the runtime image. They are published here, in
        # the same registry, under the runtime tag plus -sources, before the
        # runtime image. If this fails, nothing is released.
        if: ${{ matrix.companion }}
        id: sources
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: sources
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-sources
          labels: |
            org.opencontainers.image.title=Datawrap API corresponding source
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
          provenance: mode=max

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          # The API release image is the `release` target: the deployable
          # runtime plus the pointer (SOURCES.md, companion SHA256SUMS) naming
          # its companion. Deploys keep building the default target.
          target: ${{ matrix.companion && 'release' || '' }}
          build-args: ${{ matrix.companion && format('SOURCES_REF={0}:{1}-sources', steps.image.outputs.name, github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ matrix.companion && format('{0}:{1}-sources', steps.image.outputs.name, github.ref_name) || format('https://github.com/{0}', github.repository) }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Require the companion source image to be published
        if: ${{ matrix.companion }}
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          ref="${IMAGE_NAME}:${GITHUB_REF_NAME}-sources"
          docker buildx imagetools inspect "$ref" >/dev/null || { echo "::error::$ref is not published"; exit 1; }
          docker pull -q "${IMAGE_NAME}:${GITHUB_REF_NAME}" >/dev/null
          label=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.source" }}' "${IMAGE_NAME}:${GITHUB_REF_NAME}")
          [ "$label" = "$ref" ] || { echo "::error::the runtime image points at '$label', not $ref"; exit 1; }
          docker run --rm "${IMAGE_NAME}:${GITHUB_REF_NAME}" grep -q "$ref" /usr/share/doc/datawrap/SOURCES.md

      - name: Attest the companion source image
        if: ${{ matrix.companion }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.sources.outputs.digest }}
          push-to-registry: true

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub release
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes \
            "Corresponding source of the API image: ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_REF_NAME}-sources (see /usr/share/doc/datawrap/SOURCES.md in the image)."
