name: Studio surface
description: Install the API and web app, then run one Playwright studio project.
inputs:
  playwright_project:
    description: Playwright project name (wizard or studio-next)
    required: true
  production_smoke:
    description: Also build and run the production pageerror smoke
    required: true
  artifact_name:
    description: Artifact name uploaded when the surface fails
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install API
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r apps/api/requirements.txt

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - name: Install web
      shell: bash
      run: npm ci

    - name: Install Playwright Chromium
      shell: bash
      working-directory: apps/web
      run: npx playwright install --with-deps chromium

    - name: Start API
      shell: bash
      working-directory: apps/api
      env:
        DATAFLOW_REQUIRE_AUTH: "0"
        DATAFLOW_JOB_STORE: memory
        DATAFLOW_DISABLE_OBJECT_STORE: "1"
      run: |
        python -m uvicorn src.main:app --host 127.0.0.1 --port 8001 > /tmp/studio-api.log 2>&1 &
        for i in $(seq 1 40); do
          if curl -sf http://127.0.0.1:8001/api/v1/health >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "API did not become ready" >&2
        cat /tmp/studio-api.log >&2 || true
        exit 1

    - name: Start Vite
      shell: bash
      run: |
        npm run dev --workspace=@dataflow/web > /tmp/studio-web.log 2>&1 &
        for i in $(seq 1 40); do
          if curl -sf http://127.0.0.1:5173 >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Vite did not become ready" >&2
        cat /tmp/studio-web.log >&2 || true
        exit 1

    - name: Playwright
      shell: bash
      working-directory: apps/web
      env:
        CI: "1"
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      run: npx playwright test --project=${{ inputs.playwright_project }}

    - name: Production build
      if: success() && inputs.production_smoke == 'true'
      shell: bash
      run: npm run build --workspace=@dataflow/web

    - name: Start production preview
      if: success() && inputs.production_smoke == 'true'
      shell: bash
      working-directory: apps/web
      run: |
        npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/studio-preview.log 2>&1 &
        for i in $(seq 1 40); do
          if curl -sf http://127.0.0.1:4173 >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Production preview did not become ready" >&2
        cat /tmp/studio-preview.log >&2 || true
        exit 1

    - name: Production pageerror smoke
      if: success() && inputs.production_smoke == 'true'
      shell: bash
      working-directory: apps/web
      env:
        CI: "1"
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      run: npx playwright test --project=prod-smoke

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          apps/web/playwright-report
          apps/web/test-results
          /tmp/studio-api.log
          /tmp/studio-web.log
          /tmp/studio-preview.log
        if-no-files-found: warn
